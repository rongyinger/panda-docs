# GitLab CI —— 构建 VitePress 并发布到 GitLab Pages（部署路径 /docs/）
#
# 关键前提：GitLab 项目名建议取 "docs"。
#   GitLab Pages 的访问地址形如 https://<你的命名空间>.gitlab.io/<项目名>/，
#   项目名为 "docs" 时即 https://<命名空间>.gitlab.io/docs/，与下面的
#   DOCS_BASE=/docs/ 完全对齐，主站把 /docs/* 转发过来才不会错位。
#   （GitLab 16.7+ 也可用 pages.path_prefix 覆盖路径，见文末说明。）

image: node:20

stages:
  - deploy

pages:
  stage: deploy
  variables:
    DOCS_BASE: "/docs/"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    # pnpm build 会先解包首页（按 DOCS_BASE 重写链接）再 vitepress build
    - pnpm build
    # GitLab Pages 要求产物放在仓库根的 public/ 目录
    - rm -rf public
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
