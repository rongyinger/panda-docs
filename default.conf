# vim: ft=nginx
server {
    listen 80;
    server_name _;
    charset utf-8;

    # 兼容保留旧静态入口，避免迁移阶段影响现有外链
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control no-cache;
        expires -1h;
        try_files $uri $uri/ /index.html;
    }

    location = /docs {
        return 301 /docs/;
    }

    # 文档站统一走 VitePress 构建产物，不再读取 docs 源码目录
    location /docs/ {
        root /usr/share/nginx/html;
        add_header Cache-Control no-cache;
        expires -1h;
        try_files $uri $uri.html $uri/ /docs/404.html;
    }
}
