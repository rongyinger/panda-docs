# vim: ft=nginx
server {
    listen       80;
    server_name  _;
    charset utf-8;

    location / {
        alias   /usr/share/nginx/html/;
        add_header Cache-Control no-cache;
        expires -1h;
        try_files $uri $uri/ /index.html;
    }

    # 裸 /docs 自动补斜杠跳到 /docs/
    location = /docs { return 301 /docs/; }

    # 文档中心（VitePress 构建产物，base=/docs/，支持 clean URL）
    # 文档文件位于 /usr/share/nginx/html/docs/（来自 pandasite 仓库的 docs/ 目录）
    location /docs/ {
        root /usr/share/nginx/html;
        add_header Cache-Control no-cache;
        expires -1h;
        try_files $uri $uri.html $uri/ /docs/404.html;
    }
}
